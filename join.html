<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join on Doer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0a0a0a;
      color: #f2eee4;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }
    .card {
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 28px;
      border-radius: 50%;
      border: 3px solid #2c2a26;
      border-top-color: #e8be5a;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 0.02em;
      margin: 0 0 12px;
      color: #ffffff;
    }
    p {
      font-size: 14.5px;
      line-height: 1.6;
      color: #a39f94;
      margin: 0 0 28px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 15px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .btn-primary {
      background: #e8be5a;
      color: #0d0d0d;
    }
    .btn-secondary {
      background: transparent;
      color: #f2eee4;
      border: 1px solid #2c2a26;
    }
    .hidden { display: none; }
    .code-box {
      margin: 0 0 20px;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #2c2a26;
      text-align: center;
    }
    .code-box .label { font-size: 13px; color: #a39f94; margin: 0 0 6px; }
    .code-box .code { font-size: 30px; font-weight: 700; letter-spacing: 0.18em; color: #e8be5a; margin: 0 0 10px; font-family: 'Plus Jakarta Sans', sans-serif; }
    .code-box button {
      background: transparent; color: #f2eee4; border: 1px solid #2c2a26; border-radius: 8px;
      padding: 10px 16px; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
    }
    @media (prefers-color-scheme: light) {
      html, body { background: #fbf9f4; color: #1c1a16; }
      p { color: #6b665c; }
      h1 { color: #1c1a16; }
      .spinner { border-color: #e4dfd3; border-top-color: #a9803d; }
      .btn-primary { background: #a9803d; color: #fff; }
      .btn-secondary { color: #1c1a16; border-color: #e4dfd3; }
      .code-box { border-color: #e4dfd3; }
      .code-box .label { color: #6b665c; }
      .code-box .code { color: #a9803d; }
      .code-box button { color: #1c1a16; border-color: #e4dfd3; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div id="opening">
        <div class="spinner" style="visibility:hidden"></div>
        <h1 id="opening-title">Join on Doer</h1>
        <p>Tap below to open the challenge in the app.</p>
        <a id="open-link" class="btn btn-primary" href="#">Open in Doer</a>
      </div>

      <div id="fallback" class="hidden">
        <h1>Join on Doer</h1>
        <div id="code-box" class="code-box hidden">
          <p class="label">Your friend's code</p>
          <p class="code" id="code-text"></p>
          <button type="button" id="copy-code">Copy code</button>
        </div>
        <p id="fallback-copy">Already installed? Tap Open in Doer. If nothing happens, install the app first, open it once, then come back and tap Open in Doer.</p>
        <a id="open-link-2" class="btn btn-primary" href="#">Open in Doer</a>
        <a id="store-link" class="btn btn-secondary" href="#">Get the app</a>
        <a class="btn btn-secondary" href="https://www.dedoer.com/">Visit dedoer.com</a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var type = params.get('type');   // 'challenge' | 'group' | 'org' | 'friend' | 'referral'
      var code = params.get('code');

      var PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.dedoers.doer';
      // Same App Store id as AppStoreLinks.iosAppStoreId
      // (lib/app/utils/constants/app_store_links.dart) and index.html's own
      // download links — Doer is live on the App Store now.
      var APP_STORE_URL = 'https://apps.apple.com/app/id6778184789';

      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      var isAndroid = /Android/i.test(ua);
      var isMobile = isIOS || isAndroid;

      var openingEl = document.getElementById('opening');
      var fallbackEl = document.getElementById('fallback');
      var storeLinkEl = document.getElementById('store-link');
      var openLinkEl = document.getElementById('open-link');

      function showFallback() {
        openingEl.classList.add('hidden');
        fallbackEl.classList.remove('hidden');
      }

      storeLinkEl.href = isIOS ? APP_STORE_URL : PLAY_STORE_URL;

      // A referral link is for someone who may not have the app yet. Show
      // the code so they can type it in after signing up (the app asks "Did a
      // friend invite you?"), and copy it when they tap the store button.
      if (type === 'referral' && code) {
        var codeText = String(code).toUpperCase().replace(/[^A-Z0-9]/g, '');
        document.getElementById('code-text').textContent = codeText;
        document.getElementById('code-box').classList.remove('hidden');
        document.getElementById('opening-title').textContent = 'A friend invited you to Doer';
        var copy = function () {
          try { if (navigator.clipboard) navigator.clipboard.writeText(codeText); } catch (e) {}
        };
        document.getElementById('copy-code').addEventListener('click', function () {
          copy();
          this.textContent = 'Copied';
        });
        storeLinkEl.addEventListener('click', copy);
      }

      // No code/type, or a desktop visitor — nothing to deep-link into,
      // just show the normal "get the app" card immediately.
      if (!code || !type || !isMobile) {
        showFallback();
        return;
      }

      // 'friend' and 'referral' used to fall through to the group handler
      // (com.dedoers.doer://join/), so a friend invite link opened from a
      // browser tried to join a GROUP with a friend code. Each type now maps
      // to its own scheme host, matching deep_link_observer.dart.
      var schemeHost = type === 'challenge' ? 'join-challenge'
        : type === 'org' ? 'join-org'
        : type === 'friend' ? 'friend-invite'
        : type === 'referral' ? 'referral'
        : 'join';
      var scheme = 'com.dedoers.doer://' + schemeHost + '/' + encodeURIComponent(code);

      // iOS Safari (and, on newer Android/Chrome, to a lesser extent)
      // silently ignores a script-triggered navigation to a custom URL
      // scheme that didn't originate from a direct tap — this used to fire
      // window.location.href = scheme automatically on page load, which is
      // exactly that case. The app being installed made no difference: the
      // OS never even considered opening it, so every visit fell through to
      // the "get the app" fallback after 2s, indistinguishable from Doer
      // not being installed at all. Anchoring the same navigation to a real
      // tap on a normal link element is the standard fix — that link's own
      // default-prevented click handler below is a genuine user gesture,
      // which the OS will honor.
      // Real bug found 2026-08-21: the ONLY tap-anchored "Open in Doer"
      // button lived inside #opening, and the 2s timer below calls
      // showFallback(), which hides #opening. So the one control that can
      // actually launch the app vanished two seconds after page load, and
      // everyone who took longer than that to tap (i.e. almost everyone)
      // was left with nothing but "Get the app" and got bounced to the
      // store even with Doer already installed. An REA admin hit this
      // twice and ended up with two accounts and no membership.
      // The fallback card now carries its own Open button, so a tap-driven
      // launch stays available no matter how long the page has been open.
      var openLinkEl2 = document.getElementById('open-link-2');
      function wireOpen(el) {
        if (!el) return;
        el.href = scheme;
        el.addEventListener('click', function (e) {
          e.preventDefault();
          var fallbackTimer = setTimeout(showFallback, 2000);
          document.addEventListener('visibilitychange', function () {
            if (document.hidden) clearTimeout(fallbackTimer);
          });
          window.location.href = scheme;
        });
      }
      wireOpen(openLinkEl);
      wireOpen(openLinkEl2);

      // Still worth one automatic attempt first — some browsers/versions do
      // honor it, and this costs nothing since the button above is right
      // there as the real fallback the moment this doesn't work.
      window.location.href = scheme;
      setTimeout(function () {
        if (!document.hidden) showFallback();
      }, 2000);
    })();
  </script>
</body>
</html>
