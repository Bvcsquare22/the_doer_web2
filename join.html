<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join on Doer</title>
  <meta name="description" content="Walk, join challenges and win airtime and cash with Doer.">
  <meta property="og:title" content="Join me on Doer">
  <meta property="og:description" content="Walk, join challenges and win airtime and cash.">
  <meta property="og:image" content="https://www.dedoer.com/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0a0a0a; --card: #15130f; --line: #2c2a26; --text: #f2eee4; --muted: #a39f94;
      --gold: #e8be5a; --gold-text: #e8be5a; --on-gold: #0d0d0d;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fbf9f4; --card: #ffffff; --line: #e4dfd3; --text: #1c1a16; --muted: #6b665c;
        --gold: #c99a3e; --gold-text: #8a6420; --on-gold: #ffffff;
      }
    }
    html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
    .card { max-width: 400px; width: 100%; text-align: center; }
    .logo { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 18px; display: block; box-shadow: 0 8px 28px rgba(232,190,90,0.25); }
    h1 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 0.02em; line-height: 1.05; margin: 0 0 10px; }
    .lead { font-size: 15px; line-height: 1.55; color: var(--muted); margin: 0 0 24px; }
    .code-box { margin: 0 0 22px; padding: 18px 16px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); }
    .code-box .label { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
    .code-box .code { font-size: 32px; font-weight: 800; letter-spacing: 0.18em; color: var(--gold-text); margin: 0 0 12px; }
    .code-box button { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 18px; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
    .btn { display: block; width: 100%; padding: 16px 20px; border-radius: 14px; font-weight: 800; font-size: 16px; text-decoration: none; margin-bottom: 12px; }
    .btn-primary { background: var(--gold); color: var(--on-gold); }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .link { display: inline-block; margin-top: 6px; color: var(--muted); font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
    .steps { text-align: left; margin: 4px 0 22px; padding: 0; list-style: none; }
    .steps li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14.5px; line-height: 1.45; }
    .steps li:first-child { border-top: 0; }
    .steps .n { flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--gold); color: var(--on-gold); font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; }
    .note { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 14px 0 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img class="logo" src="/logo.png" alt="Doer">
      <h1 id="title">Join on Doer</h1>
      <p class="lead" id="lead">Walk, join challenges and win airtime and cash.</p>

      <div id="code-box" class="code-box hidden">
        <p class="label">Your friend's invite code</p>
        <p class="code" id="code-text"></p>
        <button type="button" id="copy-code">Copy code</button>
      </div>

      <ol id="steps" class="steps hidden">
        <li><span class="n">1</span><span>Get Doer from the store below.</span></li>
        <li><span class="n">2</span><span>Sign up. It takes a minute.</span></li>
        <li><span class="n">3</span><span>When Doer asks <b>"Did a friend invite you?"</b>, enter the code above.</span></li>
      </ol>

      <a id="primary" class="btn btn-primary" href="https://www.dedoer.com/">Get Doer</a>
      <a id="secondary" class="btn btn-secondary hidden" href="#">Get Doer</a>
      <a id="have-app" class="link hidden" href="#">I already have Doer, open it</a>
      <p id="note" class="note hidden"></p>
    </div>
  </div>

  <script>
    // 2026-10-02 (Charles: a referral link opened in Safari showed "Safari cannot open the page because the
    // address is invalid"). The page used to try the app's own com.dedoers.doer:// address the moment it
    // loaded. On an iPhone without Doer, Safari answers that with an error box, and on iPhone anyone who
    // HAS Doer never sees this page at all: the link opens the app directly (Universal Links,
    // .well-known/apple-app-site-association). So on iPhone this page now never tries the app by itself;
    // it leads with the App Store, with "I already have Doer" as a small tap-only link.
    // Android has no verified app links, so people with Doer do land here: one "Open in Doer" button uses
    // Android's intent link, which opens Doer if installed and goes to Google Play if not. No error either way.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var type = params.get('type');   // 'challenge' | 'group' | 'org' | 'friend' | 'referral'
      var code = params.get('code');

      var PACKAGE = 'com.dedoers.doer';
      var PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=' + PACKAGE;
      var APP_STORE_URL = 'https://apps.apple.com/app/id6778184789';

      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);

      var $ = function (id) { return document.getElementById(id); };
      var show = function (id) { $(id).classList.remove('hidden'); };

      // What each kind of link is for.
      var copy = {
        referral: ['A friend invited you to Doer', 'Walk, join challenges and win airtime and cash. Use your friend\'s code when you sign up.'],
        challenge: ['You\'re invited to a challenge', 'Join the challenge on Doer and walk your way up the leaderboard.'],
        group: ['You\'re invited to a group', 'Join the group on Doer and walk together.'],
        org: ['Join your team on Doer', 'Your company is walking together on Doer. Join your team.'],
        friend: ['Add your friend on Doer', 'Walk together, cheer each other on and see each other\'s progress.']
      };
      if (copy[type]) { $('title').textContent = copy[type][0]; $('lead').textContent = copy[type][1]; }

      var codeText = code ? String(code).toUpperCase().replace(/[^A-Z0-9]/g, '') : '';
      var copyCode = function () {
        try { if (codeText && navigator.clipboard) navigator.clipboard.writeText(codeText); } catch (e) {}
      };
      if (type === 'referral' && codeText) {
        $('code-text').textContent = codeText;
        show('code-box');
        show('steps');
        $('copy-code').addEventListener('click', function () { copyCode(); this.textContent = 'Copied'; });
      }

      var schemeHost = type === 'challenge' ? 'join-challenge'
        : type === 'org' ? 'join-org'
        : type === 'friend' ? 'friend-invite'
        : type === 'referral' ? 'referral'
        : 'join';
      var path = code ? schemeHost + '/' + encodeURIComponent(code) : '';
      var scheme = PACKAGE + '://' + path;

      var primary = $('primary');
      if (isAndroid) {
        // Opens Doer if it's installed, otherwise Chrome goes to Google Play by itself.
        var playWithRef = PLAY_STORE_URL + (codeText && type === 'referral' ? '&referrer=' + encodeURIComponent('code=' + codeText) : '');
        primary.href = code
          ? 'intent://' + path + '#Intent;scheme=' + PACKAGE + ';package=' + PACKAGE + ';S.browser_fallback_url=' + encodeURIComponent(playWithRef) + ';end'
          : playWithRef;
        // A referral is almost always someone new, so it says "Get Doer"; the same link still opens Doer
        // for anyone who has it. Other invites are usually for people who already have the app.
        var isReferral = type === 'referral';
        primary.textContent = !code ? 'Get Doer on Google Play' : isReferral ? 'Get Doer' : 'Open in Doer';
        primary.addEventListener('click', copyCode);
        var sec = $('secondary');
        sec.href = playWithRef;
        sec.textContent = 'Get Doer on Google Play';
        sec.addEventListener('click', copyCode);
        if (code && !isReferral) show('secondary');
        if (isReferral && code) { $('note').textContent = 'Your code is copied when you tap Get Doer. Paste it when Doer asks.'; show('note'); }
      } else if (isIOS) {
        primary.href = APP_STORE_URL;
        primary.textContent = 'Get Doer on the App Store';
        primary.addEventListener('click', copyCode);
        if (code) {
          var have = $('have-app');
          have.href = scheme;
          show('have-app');
          $('note').textContent = type === 'referral'
            ? 'Tip: tap Copy code first, then paste it when Doer asks.'
            : 'After installing, open this link again to join.';
          show('note');
        }
      } else {
        // Computer: both stores.
        primary.href = APP_STORE_URL;
        primary.textContent = 'Get Doer on the App Store';
        var s2 = $('secondary');
        s2.href = PLAY_STORE_URL;
        s2.textContent = 'Get Doer on Google Play';
        show('secondary');
        $('note').textContent = 'Open this link on your phone to join.';
        show('note');
      }
    })();
  </script>
</body>
</html>
