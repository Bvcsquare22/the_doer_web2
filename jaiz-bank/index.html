<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaiz Bank on Doer</title>
  <meta http-equiv="refresh" content="0; url=https://claude.ai/code/artifact/5b919caa-7205-413e-9e3f-5280367e3623">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0a0a0a;
      color: #f2eee4;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }
    .card {
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 28px;
      border-radius: 50%;
      border: 3px solid #2c2a26;
      border-top-color: #e8be5a;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 0.02em;
      margin: 0 0 12px;
      color: #ffffff;
    }
    p {
      font-size: 14.5px;
      line-height: 1.6;
      color: #a39f94;
      margin: 0 0 28px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 15px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      background: #e8be5a;
      color: #0d0d0d;
    }
    @media (prefers-color-scheme: light) {
      html, body { background: #fbf9f4; color: #1c1a16; }
      p { color: #6b665c; }
      h1 { color: #1c1a16; }
      .spinner { border-color: #e4dfd3; border-top-color: #a9803d; }
      .btn { background: #a9803d; color: #fff; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="spinner"></div>
      <h1>Jaiz Bank on Doer</h1>
      <p>Taking you to the walkthrough now.</p>
      <a class="btn" href="https://claude.ai/code/artifact/5b919caa-7205-413e-9e3f-5280367e3623">Open the walkthrough</a>
    </div>
  </div>

  <script>
    // Belt and suspenders alongside the meta refresh above — some in-app
    // browsers (banking/email apps, WhatsApp) ignore meta refresh entirely.
    window.location.replace('https://claude.ai/code/artifact/5b919caa-7205-413e-9e3f-5280367e3623');
  </script>
</body>
</html>
